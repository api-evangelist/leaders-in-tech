aid: leaders-in-tech
name: Leaders In Tech
description: 'Leaders In Tech (LIT) is a leadership accelerator for startup founders and technology
  executives, founded in 2015 and part of the Y Combinator Summer 2015 batch. Based in San Francisco,
  it runs cohort-based fellowship programs grounded in experiential, feedback-rich learning: the
  Founder Fellows Program (10 months, Series A to pre-IPO), the Grove Fellows Program (6 months,
  pre-seed and seed founders), the Executive Fellows Program (6 months, senior leaders), plus
  corporate workshops and retreats. Its primary teaching methodology is T-groups — small-group
  experiential learning built on shared observation, collective accountability and repeated practice
  — a model brought from the Stanford Graduate School of Business by co-founder Dr. Carole Robin.
  Leaders In Tech reports more than 350 alumni founders running companies valued at over $75B. It is
  a leadership-development organization, not a software or API provider: it publishes no public API,
  developer portal, SDK or machine-readable interface.'
